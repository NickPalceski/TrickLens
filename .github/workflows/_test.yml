name: _test

# Reusable job, called by both ci.yml and deploy.yml so it's defined once.
# Deliberately reuses the exact same tooling a developer runs locally
# (make init / make test / ruff) rather than reimplementing the dependency
# stack as GitHub Actions `services:` containers — see docs/ARCHITECTURE.md's
# Decisions. tests/test_clips.py runs against real Postgres AND real
# LocalStack S3 (not mocks), so both have to come up, exactly as `make up`
# does locally.

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: make init (creates .env, chmods localstack-init.sh)
        run: make init

      - name: ruff format --check
        run: docker compose run --rm api python -m ruff format --check app

      - name: ruff check
        run: docker compose run --rm api python -m ruff check app

      - name: pytest
        run: docker compose run --rm api python -m pytest

      # The worker image is the only one with ffmpeg and the CV stack, so
      # the media (6a) and analyzer (6b) tests only really run here. In the
      # api run above they skip. The real-clip tests also skip here: the
      # clips are personal footage, gitignored, never in CI.
      - name: pytest (worker image — media pipeline + analyzer)
        run: make test-worker

      # TrickLens is going closed-source: an AGPL dependency (e.g. anything
      # from `pip install ultralytics`) must never land in the worker image.
      # See docs/ARCHITECTURE.md §4.
      - name: licence check (no AGPL in the worker image)
        run: make licenses

      - name: docker compose logs (on failure)
        if: failure()
        run: docker compose logs
