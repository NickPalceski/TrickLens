<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFBF0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B120E" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TrickLens</title>
    <script>
      // Apply the saved theme before first paint so there's no flash of the
      // wrong theme. Mirrors src/app/theme.tsx (same storage key).
      try {
        const t = localStorage.getItem('tricklens:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
