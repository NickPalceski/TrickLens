# Tool configuration only. Runtime dependencies live in requirements.txt so
# that Docker can cache the dependency layer independently of the source.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented idiom

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
